<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 115" role="img" aria-label="Infama IA Agency">
  <rect width="450" height="115" fill="#000000"/>

  <!-- Diamond circuit mark -->
  <polygon points="32,10 58,55 32,100 6,55" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.9"/>
  <polygon points="32,30 48,55 32,80 16,55" fill="#14B8A6" opacity="0.1"/>

  <!-- Tip nodes -->
  <circle cx="32" cy="10" r="3" fill="#14B8A6" opacity="0.75"/>
  <circle cx="58" cy="55" r="3" fill="#14B8A6" opacity="0.75"/>
  <circle cx="32" cy="100" r="3" fill="#14B8A6" opacity="0.75"/>
  <circle cx="6"  cy="55" r="3" fill="#14B8A6" opacity="0.75"/>

  <!-- Center node -->
  <circle cx="32" cy="55" r="6" fill="#14B8A6"/>
  <circle cx="32" cy="55" r="10" fill="#14B8A6" opacity="0.15"/>

  <!-- INFAMA wordmark -->
  <text
    x="78" y="88"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-size="82"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2">INFAMA</text>

  <!-- IA AGENCY -->
  <text
    x="80" y="109"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#14B8A6"
    letter-spacing="9">IA AGENCY</text>
</svg>
